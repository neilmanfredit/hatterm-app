services:
  hattermserver:
    build: .
    image: hattermserver:latest
    container_name: hattermserver
    restart: unless-stopped
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    environment:
      HATTERM_LISTEN_ADDR: "0.0.0.0:7444"
      HATTERM_DATA_DIR: "/var/lib/hattermserver"
    env_file:
      - path: .env
        required: false
    ports:
      - "${HATTERM_HOST_BIND:-127.0.0.1}:7444:7444"
    volumes:
      - hattermserver_data:/var/lib/hattermserver

volumes:
  hattermserver_data:
    name: hattermserver_data
