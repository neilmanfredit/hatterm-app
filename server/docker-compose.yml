services:
  hattermserver:
    build: .
    image: hattermserver:latest
    container_name: hattermserver
    restart: unless-stopped
    mem_limit: 256m
    environment:
      HATTERM_LISTEN_ADDR: "0.0.0.0:8443"
      HATTERM_DATA_DIR: "/var/lib/hattermserver"
    ports:
      - "8443:8443"
    volumes:
      - hattermserver_data:/var/lib/hattermserver

volumes:
  hattermserver_data:
    name: hattermserver_data
