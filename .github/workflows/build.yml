#
# Builds the Hatterm Android APK and AAB on version tags (v*) and manual dispatch.
# Signed debug APK is attached to workflow artifacts.
# Release builds require KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD secrets to be set for release signing.

name: Build Android

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:

env:
    NODE_VERSION: 22
    JAVA_VERSION: 21

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Set up JDK
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3

            - name: Sync version from git tag
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  TAG="${{ github.ref_name }}"
                  VERSION="${TAG#v}"
                  node -e "
                    const fs = require('fs');
                    const p = JSON.parse(fs.readFileSync('package.json','utf8'));
                    p.version = '${VERSION}';
                    fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
                  "

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Build web assets
              run: npm run build

            - name: Add Android platform
              run: npx cap add android

            - name: Sync Capacitor
              run: npx cap sync android

            - name: Make gradlew executable
              run: chmod +x android/gradlew

            - name: Build debug APK
              run: cd android && ./gradlew assembleDebug

            - name: Build release AAB (if secrets available)
              if: ${{ secrets.KEYSTORE_BASE64 != '' }}
              env:
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
                  cd android && ./gradlew bundleRelease \
                    -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
                    -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                    -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                    -Pandroid.injected.signing.key.password=$KEY_PASSWORD

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hatterm-android-debug
                  path: android/app/build/outputs/apk/debug/*.apk

            - name: Upload AAB artifact
              if: ${{ secrets.KEYSTORE_BASE64 != '' }}
              uses: actions/upload-artifact@v4
              with:
                  name: hatterm-android-release
                  path: android/app/build/outputs/bundle/release/*.aab

    release:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: write
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Create draft release
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
                  name: Hatterm Android ${{ github.ref_name }}
                  generate_release_notes: true
                  draft: true
                  files: |
                      artifacts/*.apk
                      artifacts/*.aab
